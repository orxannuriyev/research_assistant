<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Async Research Assistant architecture</title>
  <desc id="desc">CLI and API enter the research engine, which validates input, orchestrates concurrent sources, caches results, and calls the AI synthesizer to produce cited answers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#475569"/>
    </marker>
    <style>
      .box { stroke: #334155; stroke-width: 2; rx: 12; }
      .label { font: 600 20px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .small { font: 15px Arial, sans-serif; fill: #334155; text-anchor: middle; }
      .arrow { stroke: #475569; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .group { font: 700 18px Arial, sans-serif; fill: #64748b; text-anchor: middle; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="600" y="42" class="group">TOPIC 4 - ASYNC RESEARCH ASSISTANT</text>

  <rect x="55" y="105" width="190" height="78" class="box" fill="#dbeafe"/>
  <text x="150" y="137" class="label">CLI</text>
  <text x="150" y="163" class="small">python -m researcher</text>

  <rect x="55" y="245" width="190" height="78" class="box" fill="#dbeafe"/>
  <text x="150" y="277" class="label">FastAPI</text>
  <text x="150" y="303" class="small">POST /research</text>

  <rect x="330" y="170" width="230" height="110" class="box" fill="#dcfce7"/>
  <text x="445" y="207" class="label">ResearchEngine</text>
  <text x="445" y="235" class="small">validation + workflow</text>
  <text x="445" y="258" class="small">ResearchSession</text>

  <rect x="650" y="90" width="245" height="125" class="box" fill="#fef3c7"/>
  <text x="772" y="127" class="label">Orchestrator</text>
  <text x="772" y="155" class="small">asyncio.gather</text>
  <text x="772" y="178" class="small">semaphore + timeout</text>
  <text x="772" y="201" class="small">arXiv rate limiter</text>

  <rect x="650" y="300" width="245" height="105" class="box" fill="#fef3c7"/>
  <text x="772" y="337" class="label">CacheService</text>
  <text x="772" y="365" class="small">canonical key + TTL</text>
  <text x="772" y="388" class="small">filesystem or memory</text>

  <rect x="980" y="55" width="165" height="58" class="box" fill="#fee2e2"/>
  <text x="1062" y="90" class="label">Wikipedia</text>
  <rect x="980" y="135" width="165" height="58" class="box" fill="#fee2e2"/>
  <text x="1062" y="170" class="label">arXiv</text>
  <rect x="980" y="215" width="165" height="58" class="box" fill="#fee2e2"/>
  <text x="1062" y="250" class="label">Web search</text>

  <rect x="650" y="510" width="245" height="105" class="box" fill="#ede9fe"/>
  <text x="772" y="547" class="label">AIService</text>
  <text x="772" y="575" class="small">retry + backoff</text>
  <text x="772" y="598" class="small">AI timeout</text>

  <rect x="980" y="510" width="165" height="105" class="box" fill="#dcfce7"/>
  <text x="1062" y="547" class="label">Cited answer</text>
  <text x="1062" y="575" class="small">AnswerWith</text>
  <text x="1062" y="596" class="small">Citations</text>

  <path d="M245 144 L330 205" class="arrow"/>
  <path d="M245 284 L330 245" class="arrow"/>
  <path d="M560 205 L650 155" class="arrow"/>
  <path d="M560 230 L650 350" class="arrow"/>
  <path d="M772 215 L772 300" class="arrow"/>
  <path d="M895 130 L980 84" class="arrow"/>
  <path d="M895 153 L980 164" class="arrow"/>
  <path d="M895 177 L980 244" class="arrow"/>
  <path d="M772 405 L772 510" class="arrow"/>
  <path d="M895 562 L980 562" class="arrow"/>
</svg>
